# Nakli - build & deploy pipeline
#
# Monorepo: the whole repo is deployed to /var/www and `start` points at the
# service's entrypoint. Node resolves node_modules by walking up from the
# entrypoint, so per-app installs work without any deployFiles path juggling.

zerops:
  # ---------------------------------------------------------------- api
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        # deps live in the ROOT package.json so core/ resolves them too - a
        # per-app node_modules is invisible to a sibling directory
        - npm install --omit=dev
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node api/index.js
      envVariables:
        # ${db_*} references the postgresql service by hostname; discrete parts
        # rather than the connection string so there is nothing to mis-parse
        DB_HOST: ${db_hostname}
        DB_PORT: ${db_port}
        DB_USER: ${db_user}
        DB_PASSWORD: ${db_password}
        DB_NAME: ${db_dbName}
        NATS_URL: ${bus_connectionString}
        NATS_USER: ${bus_user}
        NATS_PASSWORD: ${bus_password}
        CACHE_URL: ${cache_connectionString}
      # execPeriod/failureTimeout are time.Duration - bare ints are rejected
      healthCheck:
        httpGet:
          port: 3000
          path: /health
        execPeriod: 10s
        failureTimeout: 60s

  # -------------------------------------------------------------- probe
  # No ports: pulls work off NATS, never serves HTTP.
  - setup: probe
    build:
      base: nodejs@22
      buildCommands:
        - npm install --omit=dev
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      start: node probe/index.js
      envVariables:
        NATS_URL: ${bus_connectionString}
        NATS_USER: ${bus_user}
        NATS_PASSWORD: ${bus_password}
        PROBE_CONCURRENCY: 25

  # ---------------------------------------------------------------- web
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - npm install --omit=dev
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node web/server.js
      envVariables:
        # reached over the project's private network, not the public internet
        API_URL: http://api:3000
      healthCheck:
        httpGet:
          port: 3000
          path: /healthz
        execPeriod: 10s
        failureTimeout: 60s
